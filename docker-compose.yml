services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      PDFS_DIR: /data/pdfs
    volumes:
      - pdfs_data:/data/pdfs

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pdfs_data:
