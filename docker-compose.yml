services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: byorag
      POSTGRES_PASSWORD: byorag
      POSTGRES_DB: byorag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      PDFS_DIR: /data/pdfs
      DATABASE_URL: postgresql+psycopg://byorag:byorag@postgres:5432/byorag
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-anthropic}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:-}
    volumes:
      - pdfs_data:/data/pdfs
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pdfs_data:
  pgdata:
